version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: validator
    main: ./cmd/validator/
    binary: validator
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/NethermindEth/starknet-staking-v2/validator.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: >-
      starknet-staking-v2_{{ .Tag }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

kos:
  - id: validator-image
    build: validator
    base_image: cgr.dev/chainguard/static:latest
    bare: true
    creation_time: "{{ .CommitTimestamp }}"
    labels: &image-metadata
      org.opencontainers.image.title: starknet-staking-v2
      org.opencontainers.image.description: Validator program for Starknet stakers created by Nethermind
      org.opencontainers.image.source: https://github.com/NethermindEth/starknet-staking-v2
      org.opencontainers.image.url: https://nethermindeth.github.io/starknet-staking-v2/
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.vendor: Nethermind
      org.opencontainers.image.authors: Nethermind
      org.opencontainers.image.licenses: MIT
    annotations: *image-metadata
    platforms:
      - linux/amd64
      - linux/arm64
    repositories:
      - docker.io/nethermind/starknet-staking-v2
    tags:
      - "{{ .Tag }}"
      - "{{ if not .Prerelease }}latest{{ end }}"

release:
  github:
    owner: NethermindEth
    name: starknet-staking-v2
  prerelease: auto
  draft: true
  use_existing_draft: true
  footer: |-
    ## Docker Images

    - `nethermind/starknet-staking-v2:{{ .Tag }}`
    {{- if not .Prerelease }}
    - `nethermind/starknet-staking-v2:latest`
    {{- end }}

