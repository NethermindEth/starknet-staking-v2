name: Docs release sync

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to document, e.g. v0.4.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docs-release-sync-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Check out the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          path: release-src
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Generate the references
        run: make docs-gen DOCS_SRC=release-src

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: docs/.nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Test and build the docs
        working-directory: docs
        run: |
          npm ci
          npm test
          npm run build

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(docs/docs/_config-options.md docs/docs/_metrics.md)
          if [ -z "$(git status --porcelain -- "${files[@]}")" ]; then
            echo "The references already match $TAG"
            exit 0
          fi

          branch="docs/sync-$TAG"
          git switch -c "$branch"
          git add -- "${files[@]}"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "docs: sync the options and metrics references with $TAG" \
            -m "Generated by make docs-gen from the $TAG source."
          git push --force origin "$branch"

          open=$(gh pr list --head "$branch" --state open --json number --jq length)
          if [ "$open" != "0" ]; then
            echo "Updated the open pull request for $branch"
            exit 0
          fi
          gh pr create --base main --head "$branch" \
            --title "docs: sync the options and metrics references with $TAG" \
            --body "Regenerates the configuration options and metrics tables from the $TAG source with \`make docs-gen\`. This workflow already ran \`npm test\` and the docs build on this tree. Pull requests opened by GITHUB_TOKEN start no other workflows: close and reopen this one to run CI before merging."
