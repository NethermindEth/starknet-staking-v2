name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: Run golangci-lint on the diff
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --config=./.golangci_diff.yaml
          only-new-issues: true

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      HTTP_PROVIDER_URL: ${{ secrets.TEST_HTTP_PROVIDER_URL }}
      WS_PROVIDER_URL: ${{ secrets.TEST_WS_PROVIDER_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Run Tests with Coverage
        run: make test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Build Validator
        run: make validator

      - name: Verify Validator Build Output
        run: test -f build/validator

      - name: Build Signer
        run: make signer

      - name: Verify Signer Build Output
        run: test -f build/signer

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Build the Docker image
        run: docker build --pull --tag starknet-staking-v2:vulncheck .

      - name: Scan the repository with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          skip-dirs: docs
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan the Docker image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: starknet-staking-v2:vulncheck
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
