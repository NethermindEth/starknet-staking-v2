name: Set up Go
description: Installs the newest patch release of the Go minor version declared in go.mod
runs:
  using: composite
  steps:
    - id: go
      shell: bash
      run: |
        minor=$(sed -nE 's/^go ([0-9]+\.[0-9]+).*/\1/p' go.mod)
        latest=$(curl -fsSL --max-time 30 'https://go.dev/dl/?mode=json' | jq -r --arg prefix "go$minor." '[.[] | select(.stable and (.version | startswith($prefix))) | .version | ltrimstr("go")] | sort_by(split(".") | map(tonumber)) | last // empty' || true)
        echo "version=${latest:-$minor}" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ steps.go.outputs.version }}
        check-latest: true
